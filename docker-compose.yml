services:
  db:
    # pgvector's image (not vanilla postgres) so the vector extension is
    # available for the mid-term memory store.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memshin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-memshin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memshin} -d ${POSTGRES_DB:-memshin}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
