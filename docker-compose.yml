services:
  db:
    # Official postgres:17 plus the pgvector extension. Pinned to the trixie
    # variant to match the glibc that postgres:17 used, so the existing pgdata
    # volume's text collations stay valid — the default (bookworm) tag has an
    # older glibc and triggers a collation version mismatch.
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memshin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-memshin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memshin} -d ${POSTGRES_DB:-memshin}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
